name = "powerhour"
main = ".open-next/worker.js"
compatibility_date = "2026-03-05"
compatibility_flags = ["nodejs_compat"]

# Public environment variables (visible in code)
[vars]
NODE_ENV = "production"

[assets]
directory = ".open-next/assets"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false